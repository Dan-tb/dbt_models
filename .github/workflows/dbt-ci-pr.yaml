name: dbt CI validation on PR

on:
  pull_request:
    branches: [my-test-setup]
    paths:
      - 'dbx_learn_dev/**'
      - '.github/workflows/dbt-ci-pr.yaml'

jobs:
  parse:
    name: "dbt parse"
    runs-on: ubuntu-latest
 
    env:
      DBT_DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
      DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
      DBT_DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
    outputs:
      model_count: ${{ steps.parse.outputs.model_count }}
      test_count: ${{ steps.parse.outputs.test_count }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install -r requirements.txt
    
      - name: Install dbt packages
        run: dbt deps --profiles-dir . --project-dir .

      # -------------------------
      # 1. PARSE (fast fail)
      # -------------------------
      - name: Parse project
        run: |
          dbt parse --profiles-dir . --project-dir . --target ci --no-partial-parse
          echo "model_count=$(python -c 'import json; print(len(json.load(open("target/manifest.json"))["nodes"]))')" >> $GITHUB_OUTPUT
          echo "test_count=$(python -c 'import json; print(len([n for n in json.load(open("target/manifest.json"))["nodes"].values() if n["resource_type"] == "test"]))')" >> $GITHUB_OUTPUT

      # -------------------------
      # 2. GET BASELINE MANIFEST
      # -------------------------
      - name: upload parse manifest
        uses: actions/upload-artifact@v3
        with:
          name: parse-manifest
          path: dbx_learn_dev/target/manifest.json

      # -------------------------
      # 3. COMPILE
      # -------------------------
    compile:
      name: "dbt compile"
      runs-on: ubuntu-latest
      needs: parse
      outputs:
        compile_counts: ${{ steps.compile.outputs.compile_counts }}
        modified_count: ${{ steps.compile.outputs.modified_count }}
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: cache pip packages
          uses: actions/cache@v3
          with:
            path: ~/.cache/pip
            key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
            restore-keys: |
              ${{ runner.os }}-pip-
        
        - name: Install dbt
        - run: pip install -r requirements.txt
    
        - name: Install dbt packages
          run: dbt deps --profiles-dir . --project-dir .

        - name: Download parse manifest
          uses: actions/download-artifact@v3
          with:
            path: dbx_learn_dev/target/manifest.json
            key: dbt-manifest-main-${{ github.base_ref }}
            restore-keys: |
              dbt-manifest-main-
        - name: Compile project
          id: compile
          run: |
            dbt compile --profiles-dir . --project-dir . --target ci
            python count_compile_results.py dbx_learn_dev/target/manifest.json ${{ github.base_ref }} > compile_counts.txt
            echo "compile_counts=$(cat compile_counts.txt)" >> $GITHUB_OUTPUT   
        
        - name: upload compile counts
          uses: actions/upload-artifact@v3
          with:
            name: compile-artifacts
            path: dbx_learn_dev/target/manifest.json

      
      # -------------------------
      # 5. POST PR COMMENT
      # -------------------------
    Comment PR with results:
      name: "Post PR results"
      runs-on: ubuntu-latest
      needs: [parse, compile]
      if: always() # we want to post results even if previous steps fail
      permissions: 
        pull-requests: write
      steps:
        - name: Post comment with results
          uses: marocchino/sticky-pull-request-comment@v2
          with:
            script: |
            const status = "${{ steps.dbt_run.outcome }}";
            const body = status === "success"
              ? "✅ dbt CI Passed! Models validated successfully."
              : "❌ dbt CI Failed. Check logs for details.";

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });   