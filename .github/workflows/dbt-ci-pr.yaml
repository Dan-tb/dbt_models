name: dbt CI validation on PR

on:
  pull_request:
    branches: [my-test-setup]
    paths:
      - 'dbx_learn_dev/**'
      - '.github/workflows/dbt-ci-pr.yaml'

jobs:

  # -------------------------
  # 1. PARSE
  # -------------------------
  parse:
    name: "dbt parse"
    runs-on: ubuntu-latest
    env:
      DBT_DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
      DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
      DBT_DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
    outputs:
      model_count: ${{ steps.parse.outputs.model_count }}
      test_count: ${{ steps.parse.outputs.test_count }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          dbt deps --profiles-dir . --project-dir .

      - name: Parse project
        id: parse
        run: |
          dbt parse --profiles-dir . --project-dir . --target ci --no-partial-parse
          echo "model_count=$(python -c 'import json; print(len(json.load(open(\"target/manifest.json\"))["nodes"]))')" >> $GITHUB_OUTPUT
          echo "test_count=$(python -c 'import json; print(len([n for n in json.load(open(\"target/manifest.json\"))["nodes"].values() if n[\"resource_type\"] == \"test\"])))')" >> $GITHUB_OUTPUT

      - name: Upload parse manifest
        uses: actions/upload-artifact@v3
        with:
          name: parse-manifest
          path: dbx_learn_dev/target/manifest.json

  # -------------------------
  # 2. COMPILE
  # -------------------------
  compile:
    name: "dbt compile"
    runs-on: ubuntu-latest
    needs: parse
    outputs:
      compile_counts: ${{ steps.compile.outputs.compile_counts }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          dbt deps --profiles-dir . --project-dir .

      - name: Download parse manifest
        uses: actions/download-artifact@v3
        with:
          path: dbx_learn_dev/target/manifest.json
          name: parse-manifest

      - name: Compile project
        id: compile
        run: |
          dbt compile --profiles-dir . --project-dir . --target ci
          python count_compile_results.py dbx_learn_dev/target/manifest.json ${{ github.base_ref }} > compile_counts.txt
          echo "compile_counts=$(cat compile_counts.txt)" >> $GITHUB_OUTPUT

      - name: Upload compile artifact
        uses: actions/upload-artifact@v3
        with:
          name: compile-artifacts
          path: dbx_learn_dev/target/manifest.json

  # -------------------------
  # 3. POST PR COMMENT
  # -------------------------
  post_pr_results:
    name: "Post PR results"
    runs-on: ubuntu-latest
    needs: [parse, compile]
    if: always() # post even if previous jobs fail
    permissions:
      pull-requests: write
    steps:
      - name: Post comment with results
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "dbt CI Results"
          message: |
            ${{ needs.compile.result == 'success' && '✅ dbt CI Passed! Models validated successfully.' || '❌ dbt CI Failed. Check logs for details.' }}